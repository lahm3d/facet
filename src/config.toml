[hucs]
batch_csv = "c:/chesapeake_bay/sample_data/batch.csv" # Absolute filepath of a CSV containing a list of HUC codes to process, set to "None" if using a single HUC code
huc = "None" # Single HUC code to use ("0401030204"), set to "None" is using a CSV of HUC codes

[ancillary]
data = "c:/chesapeake_bay/sample_data"
flowlines = "https://gis-data.chesapeakebay.net/facet_misc_data/NHDPlus_HR_NetworkFlowline.parquet"
nhd_area = "https://gis-data.chesapeakebay.net/facet_misc_data/NHDPlus_HR_Area.parquet"
nhd_wbds = "https://gis-data.chesapeakebay.net/facet_misc_data/NHDPlus_HR_Waterbody.parquet"
physiography = "https://gis-data.chesapeakebay.net/facet_misc_data/physiography_orig.parquet"
census_roads = "https://gis-data.chesapeakebay.net/facet_misc_data/Census_roads_2023.parquet"
census_rails = "https://gis-data.chesapeakebay.net/facet_misc_data/Census_rails_2023.parquet"
cutlines = ""

[debug]
version = "test-01" # short description of version

[spatial_ref]
epsg = "5070"
cell_size = 1

[preprocess]
preprocess_flag = false # A boolean flag to determine whether preprocessing occurs
preprocess_version = 'test_network_delineation_method_2' # Name of alternative version where preprocess outputs are located if "preprocess_flag = true"
    
	[preprocess.burn_cutlines]
	burn_cutlines_flag = true # Flag to determine whether cutlines are burned into the DEM for hydro-enforcement (true or false)
	
    [preprocess.burn_stream_at_roads]
	burn_stream_at_roads_flag = false # Flag to determine whether rail/road crossings are breached at pre-defined streamlines for hydro-enforcement (true or false)
    width = 100

    [preprocess.denoise]
	denoise_flag = false # Boolean flag to determine whether DEM denoising is desired (highly suggested for high-resolution DEMs that have not yet been denoised) (true or false)
    filter_size = 11
    norm_diff = 10
    num_iter = 3

    [preprocess.breach_depression_least_cost]
    dist = 200 # maximum search distance for breach paths in cells
    fill = true
    
    [preprocess.reach-order]
    reach_id = "LINKNO"
    order_id = "strmOrder"

    [preprocess.taudem]
    cores = 2 # set how many cores you want TauDEM to use
	network_method = "area_threshold" # Network method should either be "area_threshold" or "flowline_weights"
	drainage_threshold = 10000 # drainage area threshold in number of cells

[reuse_xn]
		reuse_xn_flag = false # A boolean flag to determine whether channel and floodplain metrics will be delineated from previously generated cross-sections, skip the cross-section generation steps
		reuse_xn_data = "" # The data directory (containing a version subdirectory) in which the previously generated channel and floodplain cross sections are located
		reuse_xn_version = "" # Name of alternative version in which the previously generated channel and floodplain cross sections are located

[xn_lengths]
    xn_gap = 5
    xn_slope_vertical_cutoff = 20

    [xn_lengths.channel]
    "1".xn_len = 20
    "1".pf_len = 2
    "2".xn_len = 23
    "2".pf_len = 6
    "3".xn_len = 40
    "3".pf_len = 9
    "4".xn_len = 60
    "4".pf_len = 12
    "5".xn_len = 80
    "5".pf_len = 15
    "6".xn_len = 150
    "6".pf_len = 20

    [xn_lengths.floodplain]
    "1".xn_len = 50
    "1".pf_len = 5
    "2".xn_len = 75
    "2".pf_len = 8
    "3".xn_len = 100
    "3".pf_len = 12
    "4".xn_len = 200
    "4".pf_len = 20
    "5".xn_len = 300
    "5".pf_len = 30
    "6".xn_len = 500
    "6".pf_len = 40

[methods]

    [methods.cross_section]
    parm_ivert = 0.2
    parm_ratiothresh = 1.5
    parm_slpthresh = 0.03
    p_xngap = 3
    cell_size = 1 # based on resolution

    [methods.curvature]
    buffer = 3 # no. of cells
    curve_threshold = 0.30 # 3m DEM
    minimum_window_size = 9
    method = "wavelet"  # default
    # method = "mean"
    i_step = 100
    max_buff = 30

        [methods.curvature.windows]
        "1".window_height = 20
        "1".window_width  = 20
        "2".window_height = 20
        "2".window_width  = 20
        "3".window_height = 20
        "3".window_width  = 20
        "4".window_height = 20
        "4".window_width  = 20
        "5".window_height = 40
        "5".window_width  = 40
        "6".window_height = 80
        "6".window_width  = 80

    [methods.flood_thresholds]
    # units sq kilometers
    min_drainage_area = 3
    max_drainage_area = 3000

[postprocess]
post-process = true
stream-buffer = 60
r-exe-path = "c:/Program Files/R/.../bin/RScript.exe"
clean = false
archive = false
